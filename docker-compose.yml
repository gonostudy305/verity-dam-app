# VerityDAM Local Stack: PostgreSQL 17 / pgvector + Next.js App + Python Worker
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ${VERITY_DB_CONTAINER_NAME:-verity_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verity_dam}
      POSTGRES_USER: ${POSTGRES_USER:-verity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verity_dev_only}
    volumes:
      - verity_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${VERITY_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-verity} -d ${POSTGRES_DB:-verity_dam}']
      interval: 10s
      timeout: 5s
      retries: 5

  verity-dam-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${VERITY_APP_CONTAINER_NAME:-verity_dam_app}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VERITY_WEB_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://verity:verity_dev_only@postgres:5432/verity_dam}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-verity-dam-secret-key-change-me}
      VERITY_TRUSTED_ORIGINS: ${VERITY_TRUSTED_ORIGINS:-http://localhost:3000}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_BUCKET: ${R2_BUCKET:-verity-dam}
      R2_REGION: ${R2_REGION:-auto}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      VERITY_VISION_CONFIG_MASTER_KEY: ${VERITY_VISION_CONFIG_MASTER_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      AI_VISION_RATE_LIMIT_PER_MINUTE: ${AI_VISION_RATE_LIMIT_PER_MINUTE:-60}
      # Used by /api/internal/media-search (MCP media_search) and the MCP status probe.
      VERITY_INTERNAL_SERVICE_KEY: ${VERITY_INTERNAL_SERVICE_KEY:-}
      VERITY_MCP_INTERNAL_URL: ${VERITY_MCP_INTERNAL_URL:-http://verity-dam-mcp:8000}
      # Public MCP URL shown/probed on the settings page (default: $BETTER_AUTH_URL/mcp).
      VERITY_MCP_PUBLIC_URL: ${VERITY_MCP_PUBLIC_URL:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/api/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  verity-dam-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${VERITY_WORKER_CONTAINER_NAME:-verity_dam_worker}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://verity:verity_dev_only@postgres:5432/verity_dam}
      VERITY_WORKER_ID: ${VERITY_WORKER_ID:-verity-worker-local}
      VERITY_WORKER_POLL_SECONDS: ${VERITY_WORKER_POLL_SECONDS:-3}
      VERITY_SCENE_DUPLICATE_THRESHOLD: ${VERITY_SCENE_DUPLICATE_THRESHOLD:-0.92}
      VERITY_PHASH_MAX_DISTANCE: ${VERITY_PHASH_MAX_DISTANCE:-12}
      VERITY_EMBEDDING_PROFILE: ${VERITY_EMBEDDING_PROFILE:-local_siglip2}
      VERITY_VISION_CONFIG_MASTER_KEY: ${VERITY_VISION_CONFIG_MASTER_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_BUCKET: ${R2_BUCKET:-verity-dam}
      R2_REGION: ${R2_REGION:-auto}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 30s
      timeout: 5s
      retries: 3

  # MCP server for external AI agents. Opt-in: `docker compose --profile mcp up -d`.
  verity-dam-mcp:
    profiles: ['mcp']
    build:
      context: ./backend
      dockerfile: verity_dam_mcp/Dockerfile
    container_name: ${VERITY_MCP_CONTAINER_NAME:-verity_dam_mcp}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VERITY_MCP_HOST_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://verity:verity_dev_only@postgres:5432/verity_dam}
      MCP_TRANSPORT: streamable-http
      MCP_PATH: /mcp
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-60}
      NEXT_PUBLIC_APP_URL: http://verity-dam-app:3000
      VERITY_MCP_PUBLIC_BASE_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # OAuth token audience (default $BETTER_AUTH_URL/mcp); must match the web app's value.
      VERITY_MCP_PUBLIC_URL: ${VERITY_MCP_PUBLIC_URL:-}
      VERITY_MCP_EMAIL: ${VERITY_MCP_EMAIL:-mcp-agent@veritydam.internal}
      VERITY_VISION_CONFIG_MASTER_KEY: ${VERITY_VISION_CONFIG_MASTER_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      VERITY_INTERNAL_SERVICE_KEY: ${VERITY_INTERNAL_SERVICE_KEY:?VERITY_INTERNAL_SERVICE_KEY is required for the MCP server}
      VERITY_SIGLIP2_VISION_MODEL_PATH: /app/models/siglip2-vision-opset18.onnx
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_BUCKET: ${R2_BUCKET:-verity-dam}
      R2_REGION: ${R2_REGION:-auto}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    volumes:
      - ${VERITY_MODELS_DIR:-./backend/models}:/app/models:ro
    healthcheck:
      test: ['CMD-SHELL', "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  verity_postgres_data:
